name: Build Sorteio Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SorteioPro-Android/**"
      - "sorteio-pro-offline-source.zip"
      - ".github/workflows/build-sorteio-pro.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project if needed
        run: |
          if [ ! -d "SorteioPro-Android" ]; then
            unzip -o "sorteio-pro-offline-source.zip" -d .
          fi
          test -f "SorteioPro-Android/app/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p SorteioPro-Android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sorteio-Pro-debug-APK
          path: SorteioPro-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
