name: Build Sorteio Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SorteioPro-Android/**"
      - "sorteio-pro-offline-source*.zip"
      - ".github/workflows/build-sorteio-pro.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "SorteioPro-Android" ]; then
            ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'sorteio-pro-offline-source*.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              echo "ERRO: ZIP do projeto não encontrado."
              ls -la
              exit 1
            fi
            echo "Extraindo: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d .
          fi
          if [ ! -f "SorteioPro-Android/app/build.gradle" ]; then
            echo "ERRO: estrutura Android não encontrada."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p SorteioPro-Android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sorteio-Pro-debug-APK
          path: SorteioPro-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
