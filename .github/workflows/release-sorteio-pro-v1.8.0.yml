name: Build Sorteio Pro Release APK 1.8.0
on:
  workflow_dispatch:
  push:
    paths:
      - "sorteio-pro-release-source-v1.8.0.zip"
      - ".github/workflows/release-sorteio-pro-v1.8.0.yml"
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: unzip -o sorteio-pro-release-source-v1.8.0.zip -d . && test -f SorteioPro-Android/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sorteio-pro-release.jks"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sorteio-pro-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p SorteioPro-Android :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Sorteio-Pro-v1.8.0-Release
          path: SorteioPro-Android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
